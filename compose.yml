services:
  react-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: react-app-dev-container
    ports:
      - "5173:5173"
    volumes:
      # Mount local code into the container for live updates
      - .:/app

      # Prevent local node_modules from overwriting container node_modules
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
